<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>choose your game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<noscript><style>h1{opacity:1 !important; transform:none !important} .games-wrap{opacity:1 !important; transform:none !important}</style></noscript>
<style>
  :root{
    --cw:clamp(230px,21vw,400px);         /* عرض الورقة (نسبتها 5:7 زي ورق الكوتشينة) */
    --tw:clamp(210px,22vw,270px);         /* عرض مربع اللعبة */
    --display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
    --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; min-height:100vh; overflow-x:hidden; background:#fff; color:#000; font-family:var(--body); line-height:1.7}
  :focus-visible{outline:3px solid #000; outline-offset:4px}

  /* =====================  فتح الموقع: ستارة سودا بتتفتح من النص + كارت واحد أنيق  ===================== */
  .curtain{
    position:fixed; inset:0; z-index:60; display:grid; place-items:center; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 50%, #17130f, #050403 72%);
    clip-path:circle(150% at 50% 50%);
    animation:iris 1s cubic-bezier(.76,0,.24,1) .95s forwards;
  }
  .icard{
    --iw:min(190px,40vw); width:var(--iw); aspect-ratio:5/7; position:relative;
    border-radius:calc(var(--iw) * .07); border:2px solid rgba(230,196,120,.85);
    background:
      radial-gradient(circle at 18% 16%, #000 5.5%, transparent 6.3%),
      radial-gradient(circle at 82% 16%, #000 5.5%, transparent 6.3%),
      radial-gradient(circle at 18% 84%, #000 5.5%, transparent 6.3%),
      radial-gradient(circle at 82% 84%, #000 5.5%, transparent 6.3%),
      radial-gradient(140% 110% at 30% 14%, #2c2620, #131110 65%);
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
    opacity:0; animation:introCard 1.9s cubic-bezier(.22,.75,.24,1) forwards;
  }
  .icard::before{     /* رمز دهبي بسيط في النص */
    content:"♠"; position:absolute; inset:0; display:grid; place-items:center;
    font-size:calc(var(--iw) * .3); color:transparent;
    background:linear-gradient(155deg,#f6e3ab,#c9992f 45%,#7c5a17);
    -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .icard::after{      /* ومضة ضوء بتعدي على الكارت */
    content:""; position:absolute; inset:0; border-radius:inherit; overflow:hidden;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 48%, transparent 62%);
    background-size:260% 100%; background-position:120% 0; mix-blend-mode:overlay;
    animation:shine 1.9s cubic-bezier(.3,.1,.2,1) forwards;
  }
  @keyframes iris{to{clip-path:circle(0% at 50% 50%)}}
  @keyframes introCard{
    0%   {opacity:0; transform:scale(.55) rotateY(-55deg)}
    24%  {opacity:1; transform:scale(1) rotateY(0deg)}
    72%  {opacity:1; transform:scale(1) rotateY(0deg)}
    100% {opacity:0; transform:scale(1.22) rotateY(34deg)}
  }
  @keyframes shine{0%,55%{background-position:120% 0} 78%{background-position:-40% 0} 100%{background-position:-40% 0}}

  /* =====================  الخلفية  =====================
     كل الحركة بـ transform و opacity بس (بتتنفذ على كارت الشاشة)
     عشان تفضل ناعمة على 60 إطار في الثانية. */
  .stage{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; contain:layout paint style; --pa:#fff; --pb:#fff}
  .tint{position:absolute; inset:0; background:var(--pa); opacity:0; transition:opacity .6s}
  .stage.themed .tint{opacity:.04}

  .fogwrap,.scroll{position:absolute; inset:0; will-change:transform}
  .fog{position:absolute; inset:-15%; animation:drift 28s ease-in-out infinite alternate}
  .fogwrap.back .fog{
    background:
      radial-gradient(38% 34% at 18% 28%, rgba(120,132,156,.20), transparent 70%),
      radial-gradient(42% 38% at 82% 72%, rgba(120,132,156,.17), transparent 70%);
  }
  .fogwrap.front .fog{
    animation-duration:36s; animation-direction:alternate-reverse;
    background:
      radial-gradient(34% 30% at 12% 80%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(36% 30% at 90% 20%, rgba(255,255,255,.5), transparent 70%),
      radial-gradient(30% 24% at 50% 100%, rgba(255,255,255,.45), transparent 70%);
  }
  @keyframes drift{from{transform:translate3d(-3%,1%,0)} to{transform:translate3d(3%,-2%,0)}}

  .side{position:absolute; inset:0; will-change:transform}
  .side.left {--spin:-40deg; --from:-70vw}
  .side.right{--spin:40deg;  --from:70vw}

  /* ورقة كوتشينة مايلة. مكانها وميلها وحجمها بييجوا من المتغيرات (بيتولّدوا في الـ script) */
  .sheet{
    position:absolute; top:var(--top); width:var(--cw); aspect-ratio:5/7; overflow:hidden; background:#fff;
    border-radius:calc(var(--cw) * .06);
    border:1px solid rgba(0,0,0,.10);
    box-shadow:0 18px 40px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.08);
    opacity:0; will-change:transform;
    transform:translate(0,0) rotate(var(--rz)) scale(var(--s));
    animation:
      enter 1.8s cubic-bezier(.2,.8,.2,1) var(--del,0s) both,
      float var(--dur,12s) ease-in-out calc(1.8s + var(--del,0s)) infinite;
    animation-play-state:paused;            /* بتبدأ بعد ما ورق الافتتاحية يخلص */
  }
  body.ready .sheet{animation-play-state:running}
  .side.left  .sheet{left:calc(var(--x) * 1vw + var(--push,0px))}
  .side.right .sheet{right:calc(var(--x) * 1vw + var(--push,0px))}

  @keyframes enter{
    from{opacity:0; transform:translate(var(--from),0) rotate(calc(var(--rz) + var(--spin))) scale(var(--s))}
    to  {opacity:1; transform:translate(0,0) rotate(var(--rz)) scale(var(--s))}
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) rotate(var(--rz)) scale(var(--s))}
    50%    {transform:translate(0,var(--fl)) rotate(calc(var(--rz) + 2.4deg)) scale(var(--s))}
  }

  /* الورق أبيض سادة، ولما تمرّ على لعبة كله بيتحوّل لصورتها */
  .wash,.art{position:absolute; inset:0; opacity:0; transition:opacity .5s}
  .left  .wash{background:var(--pa)}
  .right .wash{background:var(--pb)}
  .art{background-image:var(--art,none); background-size:cover; background-position:center; background-repeat:no-repeat}
  .stage.themed .wash,.stage.themed .art{opacity:1}

  /* =====================  الصفحة  ===================== */
  main{position:relative; z-index:1}
  .hero{
    position:relative; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:44px; padding:56px 20px 28px; text-align:center;
  }
  /* غيمة بيضاء ورا الكلام: بتخلّي العنوان واضح حتى لو الورق بقى أسود */
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse 52% 46% at 50% 44%, #fff 60%, rgba(255,255,255,0) 100%);
    opacity:0; transition:opacity .5s;
  }
  body.picking .hero::before{opacity:1}

  h1{
    font-family:var(--display); font-weight:700; font-size:clamp(48px,9.5vw,150px); line-height:1.05; margin:0;
    text-wrap:balance; transform-origin:50% 100%;
    text-shadow:0 0 14px #fff, 0 0 3px #fff;
    transform:scale(.25); opacity:0; will-change:transform;
    transition:transform 1.1s cubic-bezier(.34,1.45,.64,1) .1s, opacity .5s .1s;   /* بيكبر بحركة فيها ارتداد بسيط */
  }
  body.ready h1{transform:scale(1); opacity:1}
  body.ready.picking h1{transform:scale(.56); transition:transform .8s cubic-bezier(.22,1,.36,1), opacity .3s}   /* بيصغر بنعومة */

  /* الألعاب دايمًا في نص الصفحة جنب بعض، وزرار الإضافة على يمينها */
  .games-wrap{
    position:relative; width:fit-content; max-width:min(100%,900px);
    opacity:0; transform:translateY(18px);
    transition:opacity .7s .55s, transform .9s cubic-bezier(.2,.8,.2,1) .55s;
  }
  body.ready .games-wrap{opacity:1; transform:none}

  .games{display:flex; flex-wrap:wrap; justify-content:center; gap:32px; direction:ltr}
  .tile{position:relative; width:var(--tw)}
  .card{
    display:block; aspect-ratio:1; overflow:hidden; border-radius:28px; background:#eee;
    box-shadow:0 14px 34px rgba(0,0,0,.16);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.02)}
  .card img{display:block; width:100%; height:100%; object-fit:cover}

  .del{
    position:absolute; top:10px; left:10px; width:32px; height:32px; padding:0; border-radius:50%;
    background:#fff; border:1.5px solid #000; font-size:18px; line-height:1; cursor:pointer; opacity:0; transition:opacity .2s;
  }
  .tile:hover .del,.del:focus-visible,.tile:hover .edit,.edit:focus-visible{opacity:1}
  @media (hover:none){.del,.edit{opacity:1}}

  .edit{
    position:absolute; top:10px; right:10px; width:32px; height:32px; padding:0; border-radius:50%;
    background:#fff; border:1.5px solid #000; font-size:16px; line-height:1; cursor:pointer; opacity:0; transition:opacity .2s;
  }

  .add{
    position:absolute; left:100%; margin-left:28px; top:calc(var(--tw) / 2 - 60px);
    width:120px; height:120px; display:grid; place-content:center; justify-items:center; gap:2px;
    background:#fff; color:#000; border:2px dashed #000; border-radius:28px;
    font:inherit; font-weight:600; font-size:.85rem; cursor:pointer; transition:background-color .2s,color .2s;
  }
  .add .plus{font-size:2.4rem; line-height:1; font-weight:400}
  .add:hover{background:#000; color:#fff}

  label{display:block; font-weight:600; margin:18px 0 6px}
  input[type=text],input[type=url],textarea{width:100%; font:inherit; color:#000; background:#fff; padding:12px 16px; border:1.5px solid #000; border-radius:14px}
  textarea{min-height:90px; resize:vertical}
  .btn{font:inherit; font-weight:600; color:#fff; background:#000; border:1.5px solid #000; border-radius:999px; padding:12px 28px; cursor:pointer; transition:background-color .2s,color .2s}
  .btn:hover:not(:disabled){background:#fff; color:#000}
  .btn:disabled{opacity:.6; cursor:default}
  .btn.ghost{background:#fff; color:#000}
  .btn.ghost:hover{background:#000; color:#fff}
  .actions{display:flex; gap:14px; align-items:center; margin-top:22px; flex-wrap:wrap}

  /* =====================  شرح اللعبة (المربع الكبير)  ===================== */
  .details{padding:72px 20px 140px; display:flex; justify-content:center}
  .dbox{
    width:min(100%,1000px); min-height:520px; padding:40px;
    background:#fff; border:1px solid rgba(0,0,0,.12); border-radius:32px; box-shadow:0 22px 60px rgba(0,0,0,.14);
  }
  .dtabs{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:30px}
  .dtabs[hidden]{display:none}
  .dtab{
    display:flex; align-items:center; gap:10px; padding:6px 18px 6px 8px;
    font:inherit; font-weight:600; color:#000; background:#fff; border:1.5px solid #000; border-radius:999px; cursor:pointer;
    transition:background-color .2s,color .2s;
  }
  .dtab img{width:28px; height:28px; border-radius:50%; object-fit:cover}
  .dtab[aria-selected=true]{background:#000; color:#fff}
  .dbody{display:grid; grid-template-columns:1fr minmax(240px,320px); gap:44px; align-items:start}
  .dtext h2{font-family:var(--display); font-size:clamp(2rem,4vw,3rem); line-height:1.15; margin:0 0 14px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px}
  .chip{border:1.5px solid #000; border-radius:999px; padding:2px 14px; font-size:.9rem; font-weight:600}
  .ddesc{margin:0 0 28px; font-size:1.08rem; line-height:1.95; max-width:62ch}
  .dtext h3{font-family:var(--display); font-size:1.4rem; margin:0 0 6px}
  .dtext ol{list-style:none; margin:0 0 32px; padding:0; counter-reset:s}
  .dtext li{
    counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:14px; align-items:start;
    padding:12px 0; border-top:1px solid rgba(0,0,0,.12); max-width:62ch; line-height:1.8;
  }
  .dtext li::before{
    content:counter(s, arabic-indic); display:grid; place-items:center; width:34px; height:34px; border-radius:50%;
    background:#000; color:#fff; font-family:var(--display); font-weight:700;
  }
  .go{display:inline-block; text-decoration:none}
  .dimg img{display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:26px; box-shadow:0 14px 34px rgba(0,0,0,.18)}

  /* =====================  طبقة اللعبة (بتفتح فوق الموقع)  ===================== */
  .gamelayer{position:fixed; inset:0; z-index:200; background:#fff; opacity:0; transform:scale(.985); transition:opacity .35s, transform .4s cubic-bezier(.2,.8,.2,1)}
  .gamelayer.open{opacity:1; transform:none}
  .gamelayer[hidden]{display:none}
  .gamelayer iframe{display:block; width:100%; height:100%; border:0}
  html.locked,html.locked body{overflow:hidden}

  /* =====================  نافذة إضافة لعبة  ===================== */
  dialog{width:min(92vw,460px); max-height:calc(100vh - 32px); overflow:auto; padding:28px; color:#000; background:#fff; border:1px solid rgba(0,0,0,.15); border-radius:26px; box-shadow:0 24px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(255,255,255,.75); backdrop-filter:blur(3px)}
  dialog h3{font-family:var(--display); font-size:1.8rem; margin:0 0 4px}
  input[type=file]{font:inherit; max-width:100%}
  .colors{display:flex; gap:12px; align-items:center}
  input[type=color]{width:56px; height:44px; padding:2px; border:1.5px solid #000; border-radius:12px; background:#fff; cursor:pointer}
  .hint{font-size:.85rem; margin:4px 0 6px}
  .dlg-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:4px}
  .xbtn{width:38px; height:38px; padding:0; font-size:1.05rem; line-height:1; cursor:pointer; background:#fff; border:1.5px solid #000; border-radius:50%; transition:background-color .2s,color .2s}
  .xbtn:hover{background:#000; color:#fff}
  .prevrow{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap}
  .prevrow .pillbtn{margin-bottom:2px}
  .pillbtn{padding:7px 20px; font:inherit; font-weight:600; color:#fff; background:#000; border:1.5px solid #000; border-radius:999px; cursor:pointer; transition:background-color .2s,color .2s}
  .pillbtn:hover{color:#000; background:#fff}
  .pillbtn.small{padding:5px 16px; font-size:.9rem}
  .stepsedit{list-style:none; margin:0 0 10px; padding:0; counter-reset:s}
  .stepsedit li{counter-increment:s; display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:start; margin-bottom:8px}
  .stepsedit li::before{
    content:counter(s, arabic-indic); display:grid; place-items:center; width:30px; height:30px; margin-top:6px;
    color:#fff; background:#000; border-radius:50%; font-family:var(--display); font-weight:700; font-size:.9rem;
  }
  .stepsedit textarea{min-height:0; resize:vertical}
  .sctl{display:flex; flex-direction:column; gap:4px; padding-top:4px}
  .iconbtn{width:28px; height:28px; padding:0; font-size:.75rem; line-height:1; cursor:pointer; background:#fff; border:1.5px solid #000; border-radius:8px}
  .iconbtn:hover{color:#fff; background:#000}
  .dactions{display:flex; flex-wrap:wrap; gap:10px}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  #preview{display:block; width:96px; height:96px; object-fit:cover; border-radius:18px; margin-top:10px}
  #preview[hidden]{display:none}

  @media (max-width:720px){
    :root{--cw:40vw}
    .side{--push:-14vw}
    .games-wrap{width:100%; max-width:100%}
    .dbox{padding:26px}
    .add{position:static; margin:26px auto 0}
      }
  @media (max-width:820px){
    .dbody{grid-template-columns:1fr}
    .dimg{order:-1; width:min(100%,320px); margin-inline:auto}
  }
  @media (prefers-reduced-motion:reduce){
    .sheet{animation:none; opacity:1}
    .fog{animation:none}
    h1,.games-wrap{transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="stage" id="stage" aria-hidden="true">
  <div class="tint"></div>
  <div class="fogwrap back" id="fogBack"><div class="fog"></div></div>
  <div class="scroll" id="scroll">
    <div class="side left" id="sideL"></div>
    <div class="side right" id="sideR"></div>
  </div>
  <div class="fogwrap front" id="fogFront"><div class="fog"></div></div>
</div>

<main>
  <section class="hero">
    <h1 lang="en" dir="ltr">choose your game</h1>
    <div class="games-wrap">
      <div class="games" id="games"></div>
      <button class="add" id="addBtn" type="button" aria-label="إضافة لعبة"><span class="plus">+</span><span>إضافة لعبة</span></button>
    </div>
  </section>

  <section class="details" id="details">
    <div class="dbox" role="region" aria-label="شرح اللعبة" aria-live="polite">
      <div class="dtabs" id="dTabs" role="tablist" hidden></div>
      <div class="dbody" id="dBody"></div>
    </div>
  </section>
</main>

<div class="gamelayer" id="gameLayer" hidden><iframe id="gameFrame" title="اللعبة" allow="fullscreen; clipboard-write"></iframe></div>

<dialog id="addDialog">
  <form id="addForm" method="dialog">
    <div class="dlg-head">
      <h3 id="dlgTitle">إضافة لعبة</h3>
      <button class="xbtn" type="button" id="dlgClose" aria-label="إغلاق">✕</button>
    </div>

    <label for="gName">اسم اللعبة</label>
    <input type="text" id="gName" maxlength="40" required>

    <label for="gUrl">رابط صفحة اللعبة</label>
    <input type="text" id="gUrl" placeholder="games/mafia/index.html" required dir="ltr">

    <label for="gFile">صورة اللعبة</label>
    <input type="file" id="gFile" accept="image/*">
    <p class="hint">أو ألصق رابط صورة:</p>
    <input type="url" id="gImgUrl" placeholder="https://..." dir="ltr">
    <div class="prevrow">
      <img id="preview" alt="معاينة الصورة" hidden>
      <button class="pillbtn small" type="button" id="imgClear" hidden>حذف الصورة</button>
    </div>

    <label for="gDesc">شرح اللعبة</label>
    <textarea id="gDesc" maxlength="700"></textarea>

    <div class="lbl">طريقة اللعب (خطوة خطوة)</div>
    <ol class="stepsedit" id="stepsList"></ol>
    <button class="pillbtn small" type="button" id="addStep">+ إضافة خطوة</button>

    <div class="two">
      <div><label for="gPlayers">عدد اللاعبين</label><input type="text" id="gPlayers" maxlength="30"></div>
      <div><label for="gTime">مدة اللعبة</label><input type="text" id="gTime" maxlength="30"></div>
    </div>

    <label>ألوان الورق لو مفيش صورة</label>
    <div class="colors">
      <input type="color" id="gC1" value="#1d3557" aria-label="لون الورق الشمال">
      <input type="color" id="gC2" value="#457b9d" aria-label="لون الورق اليمين">
    </div>

    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">حفظ اللعبة</button>
      <button class="btn ghost" type="button" id="gCancel">إغلاق</button>
    </div>
  </form>

<script>
(() => {
  /* =====================================================
     ألعابك الثابتة:
       name   : اسم اللعبة (مش بيظهر تحت الصورة، بيتقرأ للقارئات الصوتية بس)
       url    : مسار صفحة اللعبة
       embed  : (اختياري) لعبة مدمجة جوه الملف بتفتح فوق الموقع من غير ملفات تانية
       image  : صورة اللعبة (يفضل مربعة 1080×1080). لما تمرّ على اللعبة الورق كله بيتحوّل للصورة دي
       colors : لونين للورق (بيظهروا لحد ما الصورة تفتح، أو لو مفيش صورة)
       description : شرح اللعبة (بيظهر في المربع الكبير تحت)
       steps       : خطوات اللعب، كل خطوة عنصر في القائمة (اختياري)
       players / time : عدد اللاعبين ومدة اللعبة (اختياري)
     والألعاب اللي بتضيفها بزرار "+" بتتحفظ في المتصفح.
     ===================================================== */
  const GAMES = [
    {
      name: 'مافيا', url: 'games/mafia/index.html', embed: HTML_MAFIA_B64, image: IMG_MAFIA, colors: ['#000000', '#000000'],
      /* الشرح ده مطابق للعبة مافيا اللي في games/mafia */
      players: '٤ – ٢٠ لاعب',
      time: '٢٠ – ٤٠ دقيقة',
      description: 'لعبة مافيا تقدر تلعبها أونلاين وكل لاعب من جهازه، أو على جهاز واحد بيتمرّر بين اللاعبين. كل لاعب بياخد دور سري: مافيا أو دكتور أو محقق أو مدني. المدنيين لازم يكشفوا المافيا قبل ما تخلص عليهم واحد ورا التاني.',
      steps: [
        'أونلاين: واحد ينشئ غرفة ويشارك الكود، وكل لاعب يدخل من جهازه (من ٤ لـ ٢٠ لاعب) واللعبة بتمشي أوتوماتيك. على جهاز واحد: اكتب الأسماء ومرّر الهاتف لكل لاعب عشان يشوف دوره لوحده.',
        'الليل: المقدّم (أو اللعبة نفسها أونلاين) يختار بالنيابة عنهم. المافيا تختار ضحية، والدكتور ينقذ لاعب (حتى نفسه، بس مش نفس الشخص مرتين ورا بعض)، والمحقق يتحقق من لاعب ويعرف هو مافيا ولا مدني.',
        'النهار: يتعرف مين مات، وبعدها نقاش وتصويت على إعدام لاعب.',
        'اللعبة تخلص لما المافيا كلها تطلع (فوز المدنيين) أو يتساوى عددها مع المدنيين (فوز المافيا).'
      ]
    },
  ];

  /* ---------- أدوات ---------- */
  const K_GAMES = 'gamehub.games';
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const $ = s => document.querySelector(s);
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hex = (c, d) => /^#[0-9a-f]{6}$/i.test(c) ? c : d;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function placeholder(g){
    const [a, b] = g.colors;
    const n = [...g.name].length;
    const size = Math.max(48, Math.min(150, Math.round(560 / Math.max(n, 3))));
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="205" font-size="${size}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Tahoma,Arial,sans-serif">${esc(g.name)}</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* ---------- الافتتاحية: ستارة سودا بتتفتح من النص، وفي نصها كارت أنيق بيدور ويختفي ---------- */
  function startIntro(){
    if (reduce) { document.body.classList.add('ready'); return; }
    const curtain = document.createElement('div');
    curtain.className = 'curtain';
    curtain.setAttribute('aria-hidden', 'true');
    const card = document.createElement('div');
    card.className = 'icard';
    curtain.append(card);
    document.body.append(curtain);
    setTimeout(() => { curtain.remove(); document.body.classList.add('ready'); }, 1950);
  }

  /* ---------- الخلفية ---------- */
  const stage = $('#stage');
  const scrollLayer = $('#scroll'), fogBack = $('#fogBack'), fogFront = $('#fogFront');
  const sideL = $('#sideL'), sideR = $('#sideR');

  /* بيولّد ورق كتير على كل جانب: ورقة كبيرة في النص + ورق مايل حواليها.
     الأرقام ثابتة (مش عشوائية حقيقية) فالشكل نفسه كل مرة. */
  function buildSide(el, seed, mainTilt){
    const N = 10;
    const inner = '<div class="wash"></div><div class="art"></div>';
    for (let k = 0; k < N; k++) {
      const r = n => { const v = Math.sin((k + 1) * 12.9898 + seed * 78.233 + n * 37.719) * 43758.5453; return v - Math.floor(v); };
      const s = document.createElement('div');
      s.className = 'sheet';
      const sign = r(1) > .5 ? 1 : -1;
      const vars = {
        '--x':   (-8 + r(4) * 7).toFixed(2),
        '--top': (-16 + k * (190 / (N - 1)) + (r(5) - .5) * 8).toFixed(1) + 'vh',
        '--rz':  (sign * (9 + r(2) * 22)).toFixed(1) + 'deg',
        '--s':   (.8 + r(3) * .28).toFixed(2),
        '--dur': (10 + r(6) * 6).toFixed(1) + 's',
        '--del': (k * .07 + seed * .05).toFixed(2) + 's',
        '--fl':  ((r(7) > .5 ? 1 : -1) * (10 + r(8) * 10)).toFixed(0) + 'px'
      };
      for (const p in vars) s.style.setProperty(p, vars[p]);
      s.style.zIndex = k % 3;
      s.innerHTML = inner;
      el.append(s);
    }
    const m = document.createElement('div');
    m.className = 'sheet main';
    const mv = { '--x': '-5', '--top': 'calc(50vh - var(--cw) * .7)', '--rz': mainTilt + 'deg', '--s': '1', '--dur': '14s', '--del': '0s', '--fl': '-14px' };
    for (const p in mv) m.style.setProperty(p, mv[p]);
    m.style.zIndex = 6;
    m.innerHTML = inner;
    el.append(m);
  }
  buildSide(sideL, 1, -14);
  buildSide(sideR, 2, 12);

  /* لما تمرّ على لعبة: الورق كله بيبقى بصورتها، والعنوان بيصغر بحركة ناعمة */
  let leaveT = 0;
  function setTheme(g){
    clearTimeout(leaveT);
    stage.style.setProperty('--pa', g.colors[0]);
    stage.style.setProperty('--pb', g.colors[1]);
    stage.style.setProperty('--art', g.image ? `url(${JSON.stringify(g.image)})` : 'none');
    stage.classList.add('themed');
    document.body.classList.add('picking');
  }
  function clearTheme(){
    clearTimeout(leaveT);
    leaveT = setTimeout(() => {          /* تأخير بسيط عشان المرور بين لعبتين ما يرجّعش العنوان */
      stage.classList.remove('themed');
      document.body.classList.remove('picking');
    }, 90);
  }

  /* حلقة رسم واحدة: السكرول بيطلّع الخلفية لفوق، والماوس بيحرّك الورق حركة ناعمة.
     بتشتغل بس وقت الحاجة وبتكتب transform بس. */
  let tx = 0, ty = 0, mx = 0, my = 0, running = false;
  function frame(){
    mx += (tx - mx) * .08;
    my += (ty - my) * .08;
    const y = reduce ? 0 : scrollY;
    scrollLayer.style.transform = `translate3d(0,${(-y * .75).toFixed(1)}px,0)`;
    fogBack.style.transform     = `translate3d(0,${(-y * .30).toFixed(1)}px,0)`;
    fogFront.style.transform    = `translate3d(0,${(-y * .50).toFixed(1)}px,0)`;
    sideL.style.transform = `translate3d(${(-mx * 26).toFixed(2)}px,${(-my * 18).toFixed(2)}px,0)`;
    sideR.style.transform = `translate3d(${( mx * 26).toFixed(2)}px,${( my * 18).toFixed(2)}px,0)`;
    running = Math.abs(tx - mx) > .001 || Math.abs(ty - my) > .001;
    if (running) requestAnimationFrame(frame);
  }
  function kick(){ if (!running) { running = true; requestAnimationFrame(frame); } }
  addEventListener('scroll', kick, { passive: true });
  addEventListener('pointermove', e => {
    if (reduce) return;
    tx = (e.clientX / innerWidth - .5) * 2;
    ty = (e.clientY / innerHeight - .5) * 2;
    kick();
  }, { passive: true });
  frame();

  /* ---------- فتح لعبة مدمجة فوق الموقع ---------- */
  const layer = $('#gameLayer'), gameFrame = $('#gameFrame');
  let openId = null, pushed = false;
  const decodeHTML = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

  function openGame(g){
    if (openId) return;
    openId = g.id;
    gameFrame.srcdoc = decodeHTML(g.embed);
    layer.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('open')));
    document.documentElement.classList.add('locked');
    try { history.pushState({ game: g.id }, ''); pushed = true; } catch { pushed = false; }
  }
  function closeGame(fromPop){
    if (!openId) return;
    openId = null;
    layer.classList.remove('open');
    document.documentElement.classList.remove('locked');
    setTimeout(() => { if (!openId) { layer.hidden = true; gameFrame.srcdoc = ''; } }, 400);
    if (!fromPop && pushed) history.back();
    pushed = false;
  }
  addEventListener('popstate', () => closeGame(true));
  addEventListener('message', e => { if (e.source === gameFrame.contentWindow && e.data === 'hub-close') closeGame(false); });

  /* ---------- الألعاب ---------- */
  const gamesEl = $('#games');

  function allGames(){
    const base = GAMES.map((g, i) => ({ ...g, id: 'b' + i, builtin: true }));
    const mine = store.get(K_GAMES).map(g => ({ ...g, builtin: false }));
    return base.concat(mine).map(g => ({
      ...g, colors: [hex(g.colors && g.colors[0], '#1d3557'), hex(g.colors && g.colors[1], '#457b9d')]
    }));
  }

  function renderGames(){
    gamesEl.textContent = '';
    for (const g of allGames()) {
      if (g.image) { const pre = new Image(); pre.src = g.image; }   /* تحميل مسبق عشان الورق يتغير من غير تأخير */

      const tile = document.createElement('div');
      tile.className = 'tile';

      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.embed ? '#' : g.url;
      if (g.embed) a.addEventListener('click', e => { e.preventDefault(); openGame(g); });
      a.setAttribute('aria-label', g.name);
      a.title = g.name;

      const img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.src = g.image || placeholder(g);
      img.onerror = () => { img.onerror = null; img.src = placeholder(g); };
      a.append(img);
      tile.append(a);

      if (!g.builtin) {
        const del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '×';
        del.setAttribute('aria-label', 'حذف ' + g.name);
        del.addEventListener('click', () => {
          if (!confirm('تحذف لعبة "' + g.name + '" من الموقع؟')) return;
          store.set(K_GAMES, store.get(K_GAMES).filter(x => x.id !== g.id));
          clearTheme();
          renderGames();
        });
        tile.append(del);

        const ed = document.createElement('button');
        ed.className = 'edit';
        ed.type = 'button';
        ed.textContent = '✎';
        ed.title = 'تعديل';
        ed.setAttribute('aria-label', 'تعديل ' + g.name);
        ed.addEventListener('click', () => openDialog(g));
        tile.append(ed);
      }

      tile.addEventListener('mouseenter', () => { setTheme(g); setActive(g); });
      tile.addEventListener('mouseleave', clearTheme);
      tile.addEventListener('focusin', () => { setTheme(g); setActive(g); });
      tile.addEventListener('focusout', clearTheme);
      gamesEl.append(tile);
    }
    renderDetails(false);
  }

  /* ---------- شرح اللعبة: المربع الكبير تحت، بيتغير حسب آخر لعبة أشّرت عليها أو اخترتها ---------- */
  const dTabs = $('#dTabs'), dBody = $('#dBody');
  let activeId = null;

  function setActive(g){
    if (activeId === g.id) return;
    activeId = g.id;
    renderDetails(true);
  }

  function renderDetails(animate){
    const list = allGames();
    const g = list.find(x => x.id === activeId) || list[0];
    if (!g) return;
    activeId = g.id;

    dTabs.textContent = '';
    dTabs.hidden = list.length < 2;
    for (const x of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dtab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(x.id === g.id));
      const im = document.createElement('img');
      im.alt = '';
      im.src = x.image || placeholder(x);
      const s = document.createElement('span');
      s.textContent = x.name;
      b.append(im, s);
      b.addEventListener('click', () => setActive(x));
      dTabs.append(b);
    }

    dBody.textContent = '';
    const text = document.createElement('div');
    text.className = 'dtext';
    const h = document.createElement('h2');
    h.textContent = g.name;
    text.append(h);

    const facts = [g.players, g.time].filter(Boolean);
    if (facts.length) {
      const chips = document.createElement('div');
      chips.className = 'chips';
      for (const f of facts) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = f; chips.append(c); }
      text.append(chips);
    }

    const p = document.createElement('p');
    p.className = 'ddesc';
    p.textContent = g.description || 'لسه مفيش شرح للعبة دي.';
    text.append(p);

    if (g.steps && g.steps.length) {
      const h3 = document.createElement('h3');
      h3.textContent = 'طريقة اللعب';
      const ol = document.createElement('ol');
      for (const st of g.steps) { const li = document.createElement('li'); li.textContent = st; ol.append(li); }
      text.append(h3, ol);
    }

    const go = document.createElement('a');
    go.className = 'btn go';
    go.href = g.embed ? '#' : g.url;
    if (g.embed) go.addEventListener('click', e => { e.preventDefault(); openGame(g); });
    go.textContent = 'ابدأ اللعب';
    const acts = document.createElement('div');
    acts.className = 'dactions';
    acts.append(go);
    if (!g.builtin) {
      const ed = document.createElement('button');
      ed.type = 'button';
      ed.className = 'btn ghost';
      ed.textContent = 'تعديل اللعبة';
      ed.addEventListener('click', () => openDialog(g));
      acts.append(ed);
    }
    text.append(acts);

    const fig = document.createElement('div');
    fig.className = 'dimg';
    const img = document.createElement('img');
    img.alt = g.name;
    img.src = g.image || placeholder(g);
    fig.append(img);

    dBody.append(text, fig);
    if (animate && !reduce) {
      dBody.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
                    { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
  }

  /* ---------- نافذة إضافة / تعديل لعبة ---------- */
  const dlg = $('#addDialog'), addForm = $('#addForm');
  const gName = $('#gName'), gUrl = $('#gUrl'), gFile = $('#gFile'), gImgUrl = $('#gImgUrl');
  const gC1 = $('#gC1'), gC2 = $('#gC2'), preview = $('#preview'), imgClear = $('#imgClear');
  const gDesc = $('#gDesc'), gPlayers = $('#gPlayers'), gTime = $('#gTime'), stepsList = $('#stepsList');
  const palettes = [['#1d3557','#457b9d'], ['#2d6a4f','#95d5b2'], ['#6a040f','#e85d04'], ['#3c096c','#9d4edd'], ['#003049','#f77f00']];
  let pendingImage = '', editingId = null;

  function setPreview(src){
    preview.hidden = !src;
    imgClear.hidden = !src;
    if (src) preview.src = src;
  }

  /* خطوة واحدة في المحرر: مربع كتابة + رفع / تنزيل / حذف */
  function addStepRow(text, focus){
    const li = document.createElement('li');
    const ta = document.createElement('textarea');
    ta.rows = 2; ta.maxLength = 300; ta.placeholder = 'اكتب الخطوة...'; ta.value = text || '';
    const ctl = document.createElement('div');
    ctl.className = 'sctl';
    const btn = (label, aria, fn) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'iconbtn'; b.textContent = label; b.setAttribute('aria-label', aria);
      b.addEventListener('click', fn);
      return b;
    };
    ctl.append(
      btn('▲', 'رفع الخطوة', () => { const p = li.previousElementSibling; if (p) stepsList.insertBefore(li, p); }),
      btn('▼', 'تنزيل الخطوة', () => { const n = li.nextElementSibling; if (n) stepsList.insertBefore(n, li); }),
      btn('✕', 'حذف الخطوة', () => li.remove())
    );
    li.append(ta, ctl);
    stepsList.append(li);
    if (focus) ta.focus();
  }
  $('#addStep').addEventListener('click', () => addStepRow('', true));

  function openDialog(g){
    editingId = g ? g.id : null;
    addForm.reset();
    pendingImage = '';
    gImgUrl.value = '';
    stepsList.textContent = '';
    $('#dlgTitle').textContent = g ? 'تعديل لعبة' : 'إضافة لعبة';
    $('#saveBtn').textContent = g ? 'حفظ التعديلات' : 'حفظ اللعبة';
    if (g) {
      gName.value = g.name || '';
      gUrl.value = g.url || '';
      gDesc.value = g.description || '';
      gPlayers.value = g.players || '';
      gTime.value = g.time || '';
      gC1.value = hex(g.colors && g.colors[0], '#1d3557');
      gC2.value = hex(g.colors && g.colors[1], '#457b9d');
      const img = g.image || '';
      if (img.startsWith('data:')) pendingImage = img; else gImgUrl.value = img;
      setPreview(img);
      (g.steps && g.steps.length ? g.steps : ['']).forEach(s => addStepRow(s));
    } else {
      const p = palettes[Math.floor(Math.random() * palettes.length)];
      gC1.value = p[0]; gC2.value = p[1];
      setPreview('');
      addStepRow('');
    }
    dlg.showModal();
    gName.focus();
  }
  $('#addBtn').addEventListener('click', () => openDialog(null));

  gFile.addEventListener('change', () => {
    const f = gFile.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const S = 900, c = document.createElement('canvas');
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      pendingImage = c.toDataURL('image/jpeg', .85);
      gImgUrl.value = '';
      setPreview(pendingImage);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
  gImgUrl.addEventListener('change', () => {
    const v = gImgUrl.value.trim();
    if (v) { pendingImage = ''; gFile.value = ''; }
    setPreview(pendingImage || v);
  });
  imgClear.addEventListener('click', () => { pendingImage = ''; gImgUrl.value = ''; gFile.value = ''; setPreview(''); });

  /* الإغلاق بس من زرار ✕ أو "إغلاق" (الضغط برا المربع مبقاش بيقفله) */
  $('#dlgClose').addEventListener('click', () => dlg.close());
  $('#gCancel').addEventListener('click', () => dlg.close());

  addForm.addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      name: gName.value.trim(),
      url: gUrl.value.trim(),
      image: pendingImage || gImgUrl.value.trim(),
      colors: [gC1.value, gC2.value],
      description: gDesc.value.trim(),
      steps: [...stepsList.querySelectorAll('textarea')].map(x => x.value.trim()).filter(Boolean),
      players: gPlayers.value.trim(),
      time: gTime.value.trim()
    };
    const list = store.get(K_GAMES);
    const idx = editingId ? list.findIndex(x => x.id === editingId) : -1;
    if (idx >= 0) list[idx] = { ...list[idx], ...data };
    else list.push({ id: 'u' + Date.now(), ...data });
    if (!store.set(K_GAMES, list)) {
      alert('مساحة التخزين في المتصفح ممتلئة. جرّب صورة أصغر.');
      return;
    }
    dlg.close();
    renderGames();
  });

  renderGames();
  startIntro();
})();
</script>
</body>
</html>
